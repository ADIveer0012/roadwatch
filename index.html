<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12171f">
<title>RoadWatch – Pothole Reporter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚧</text></svg>">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">🚧</span>
    <div>
      <b>RoadWatch</b>
      <small>Report road damage, get it fixed</small>
    </div>
  </div>
  <button id="out" hidden>Logout</button>
</header>

<main>
  <nav id="nav" hidden>
    <button data-t="report" class="on"><i>📷</i>Report</button>
    <button data-t="mine"><i>📋</i>My reports</button>
    <button data-t="map"><i>🗺️</i>Map</button>
    <button data-t="all"><i>🌐</i>All</button>
    <button data-t="admin" id="adminTab" hidden><i>🛠️</i>Admin</button>
  </nav>
  <div id="view"></div>
</main>

<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
